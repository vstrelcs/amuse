channel:
- access:
  - ZTF_PUB
  name: wise
  policy: []
  version: 0
mongo:
  prefix: qpes
  reset: false
name: timewise
task:
- config:
    compiler_opts: TiCompilerOptions
    directives:
    - channel: wise
      ingest:
        mux:
          combine:
          - state_t2:
            - unit: T2StackVisits
            - unit: T2FindQPEs
              config:
                t2_dependency:
                  - unit: T2StackVisits
            unit: T1HDBSCAN
            config:
              original_id_key: orig_id
              input_mongo_db_name: qpes_input
              plot: false
          unit: TiMongoMuxer
    iter_max: 100000
    shaper: TiDataPointShaper
    supplier:
      config:
        dpid: hash
        loader:
          config:
            timewise_config_file: /home/murff/software/qpes/timewise_config_smaller_chunks.yml
            stock_id_column_name: orig_id
            skip_missing_files: true
            chunks: [8]
          unit: TimewiseFileLoader
      unit: TimewiseAlertSupplier
  multiplier: 1
  title: t0
  template:
    live:
      - resolve_run_time_aliases
      - hash_t2_config
  unit: AlertConsumer
- config:
    log_profile: default
  multiplier: 1
  title: t2
  unit: T2Worker
- title: PlotHist
  unit: T3Processor
  config:
    raise_exc: true
    supply:
      unit: T3DefaultBufferSupplier
      config:
        select:
          unit: T3StockSelector
          config:
            channel: "wise"
        load:
          unit: T3SimpleDataLoader
          config:
            directives:
              - T2DOC
              - STOCK
            channel: "wise"
        chunk_size: 100000
    stage:
      unit: T3SimpleStager
      config:
        execute:
          - unit: T3PlotHist
            config:
              base_dir: /home/murff/software/qpes/ampel/qpes
              